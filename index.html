const rules=()=>modal(`<h2>📖 Propósito y reglas</h2><h3>Propósito</h3><p>Vivir una vida completa, desde el nacimiento hasta la vejez, y descubrir cuánto desarrolla tu personaje su semejanza con Jesucristo. No gana quien llega primero, sino quien termina con el Índice más alto. Es un juego: mide decisiones ficticias, no el valor de una persona real.</p><h3>Cómo se juega</h3><ol><li>Tira el dado y avanza por las 7 etapas de la vida.</li><li>La casilla donde caes activa una carta propia de esa etapa.</li><li>Cada carta suma o resta puntos en las 4 categorías.</li><li>Al llegar a 🕊️ tu personaje termina su vida. Cuando todos terminan, se calcula el Índice.</li></ol><h3>Categorías de puntos</h3><p class="muted">Todos empiezan con 10 en cada una (mínimo 0, máximo 100).</p>${catList()}<h3>Tipos de carta</h3><ul><li>🏠 <b>Hogar</b> y 🙏 <b>Fe</b>: 🧠 tú decides cómo responder.</li><li>🤝 <b>Relaciones</b> y ⚖️ <b>Decisión</b>: 🎲 el dado decide, porque no siempre controlamos las circunstancias ni las influencias. Con 1–2 sale la peor reacción, con 3–4 una intermedia y con 5–6 la mejor. Si la peor resta puntos, además pierdes un turno.</li><li>💛 <b>Servicio</b>: 🎲 tiras el dado y ganas 2, 3 o 5 de Semejanza según cuánto ayudes.</li><li>🎲 <b>Destino</b>: 1–2 consecuencias (pierdes puntos y un turno), 3–4 un día normal, 5–6 una bendición.</li><li>🔄 <b>Arrepentimiento</b>: reparas tu última decisión negativa.</li></ul><h3>Puedes cambiar tu historia</h3><p>Una vez por etapa puedes reparar una decisión negativa: recuperas hasta la mitad de los puntos perdidos (máximo 4).</p><h3>Índice final</h3><p>25 % Espiritualidad + 40 % Semejanza con Cristo + 20 % Integridad + 15 % Resiliencia. La Semejanza pesa más porque el juego premia las virtudes, no la cantidad de actividades.</p>`,['Entendido']);
const song=()=>modal(`<h2>🎵 Yo trato de ser como Cristo</h2><p class="muted">Letra y música: Janice Kapp Perry · Basada en Juan 13:15, 34</p><p>Esta es la canción de El camino del discípulo. Cántenla juntos antes de empezar o cuando todos los personajes terminen su vida: resume el propósito del juego, que es aprender a seguir el ejemplo del Salvador y a tratar con amor a quienes nos rodean.</p><p class="muted" style="font-size:14px">© 1980 Janice Kapp Perry. Se pueden hacer copias para usarlas en la Iglesia o en el hogar sin fines de lucro. Usen su partitura para cantarla.</p>`,['Cerrar']);$('#bR').onclick=rules;$('#bS').onclick=song;
$('#bT').onclick=e=>{const r=document.documentElement,n=r.dataset.theme=='dark'?'light':'dark';r.dataset.theme=n;e.currentTarget.textContent='Tema: '+(n=='dark'?'noche':'claro')};
$('#bN').onclick=async()=>{if(await modal('<h2>Nueva partida</h2><p>Se perderá el progreso actual.</p>',['Cambiar jugadores','Cancelar'])==0)setup()};
setup();
})();
</script></body></html>
